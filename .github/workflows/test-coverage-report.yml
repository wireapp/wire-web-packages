name: Test & Coverage Report

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., @wireapp/core@46.47.8)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test_coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag input
        id: parse
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${TAG_INPUT}"

          # Extract package name and version from tag
          # Format: @wireapp/package@version
          # Reject whitespace because GitHub output files are line-oriented.
          if [[ "${TAG}" =~ ^(@[^/[:space:]]+/[^@[:space:]]+)@([^[:space:]]+)$ ]]; then
            PACKAGE="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
            # Replace forward slash with hyphen for artifact name
            PACKAGE_SAFE="${PACKAGE//\//-}"
            {
              printf 'package=%s\n' "${PACKAGE}"
              printf 'version=%s\n' "${VERSION}"
              printf 'package-safe=%s\n' "${PACKAGE_SAFE}"
            } >> "${GITHUB_OUTPUT}"
            printf 'Parsed - Package: %s, Version: %s, Tag: %s\n' "${PACKAGE}" "${VERSION}" "${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Invalid tag format. Expected: @wireapp/package@version"
            exit 1
          fi

      - name: Validate and checkout tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${TAG_INPUT}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "✅ Tag found: ${TAG}"
            echo "Checking out tag: ${TAG}"
            git checkout "${TAG}"
          else
            echo "❌ Tag not found: ${TAG}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --immutable

      - name: Build dependencies
        run: yarn dist

      - name: Run tests with coverage
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
        run: |
          set -euo pipefail

          yarn workspace "${PACKAGE}" test --coverage --coverageReporters=lcov --verbose 2>&1 | tee "test-output.log"

      - name: Upload test output and coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ steps.parse.outputs.package-safe }}-${{ steps.parse.outputs.version }}
          path: |
            test-output.log
            **/coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate summary
        if: always()
        env:
          TAG_INPUT: ${{ inputs.tag }}
          PACKAGE: ${{ steps.parse.outputs.package }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "## Test Coverage Report"
            echo ""
            printf '**Tag:** %s\n' "${TAG_INPUT}"
            printf '**Package:** %s\n' "${PACKAGE}"
            printf '**Version:** %s\n' "${VERSION}"
            echo ""
            echo "✅ Coverage report generated and available for download"
          } >> "${GITHUB_STEP_SUMMARY}"
